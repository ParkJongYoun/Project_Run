<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Run</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { --viewport-height: 100vh; height: var(--viewport-height); display: grid; place-items: center; padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); background: #090d12; color: #fff4d6; font: 16px system-ui, sans-serif; }
    /* Fit the complete 16:9 game inside the available viewport, including ultrawide screens. */
    #game { position: relative; width: min(100%, calc((var(--viewport-height) - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)) * 16 / 9)); aspect-ratio: 16 / 9; background: #152c32; }
    @supports (height: 100dvh) { body { --viewport-height: 100dvh; } }
    #rotate-hint { display: none; position: fixed; bottom: max(24px, env(safe-area-inset-bottom)); left: 16px; right: 16px; margin: 0; text-align: center; font-size: 15px; color: #fff4d6; pointer-events: none; }
    @media (orientation: portrait) { #rotate-hint { display: block; } }
    canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
    #loading, #error { position: absolute; inset: 0; display: grid; place-content: center; gap: 18px; padding: 32px; text-align: center; background: #152c32; }
    #loading strong { font-size: 24px; letter-spacing: .12em; }
    progress { width: min(65vw, 260px); height: 12px; accent-color: #e7bf69; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main id="game" aria-label="Project Run 레이스">
    <canvas id="unity-canvas" width="1280" height="720" tabindex="0" aria-label="레이스 게임"></canvas>
    <div id="loading" role="status"><strong>PROJECT RUN</strong><span>경기장을 준비하고 있어요</span><progress id="progress" max="1" value="0" aria-label="게임 로딩"></progress></div>
    <div id="error" role="alert" hidden>게임을 불러오지 못했습니다.<br>페이지를 새로고침해 주세요.</div>
  </main>
  <p id="rotate-hint" role="status">기기를 가로로 돌리면 더 넓게 즐길 수 있어요.</p>
  <script src="Build/심사데모_WebGL.loader.js"></script>
  <script>
    const loading = document.getElementById('loading');
    const progress = document.getElementById('progress');
    function reportError(message) {
      console.error(message);
      loading.hidden = true;
      document.getElementById('error').hidden = false;
    }
    createUnityInstance(document.getElementById('unity-canvas'), {
      arguments: [],
      dataUrl: 'Build/심사데모_WebGL.data',
      frameworkUrl: 'Build/심사데모_WebGL.framework.js',
      codeUrl: 'Build/심사데모_WebGL.wasm',
      streamingAssetsUrl: 'StreamingAssets',
      companyName: "DefaultCompany",
      productName: "Run",
      productVersion: "0.1.0",
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      showBanner: (message, type) => type === 'error' ? reportError(message) : console.warn(message)
    }, value => { progress.value = value; }).then(() => { loading.hidden = true; }).catch(reportError);
  </script>
</body>
</html>
